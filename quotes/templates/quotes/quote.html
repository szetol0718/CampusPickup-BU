{% extends "quotes/base.html" %}
{% load static %}

{% block content %}
<div class="quote-box">

    <img
        src="{% static image %}"
        alt="Confucius"
        class="quote-image"
    >

    <blockquote>
        “{{ quote }}”
    </blockquote>

</div>
{% endblock %}
