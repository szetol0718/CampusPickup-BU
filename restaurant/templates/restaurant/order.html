Description: Online ordering page for Lee Po Cafe. Displays menu items,

-->

{% extends "restaurant/base.html" %}
{% block content %}

<section>
    <h2>Order Online</h2>

    <form action="{% url 'confirmation' %}" method="post">
        {% csrf_token %}

        <!-- This is the main menu section -->
    <div class="card">
        <h3>Menu</h3>

        {% for name, price in menu.items %}
            <label class="menu-item">
                <input type="checkbox" name="{{ name }}">
                {{ name }} -- ${{ price }}
            </label><br>

            {% if name == "Hong Kong Style Milk Tea" %}
            <div class="options">
                <p><strong>Milk Tea Options</strong></p>

                <label>
                    Sugar Level:
                    <select name="tea_sugar">
                        <option value="Regular" selected>Regular</option>
                        <option value="Less">Less sugar</option>
                        <option value="Half">Half sugar</option>
                        <option value="No">No sugar</option>
                    </select>
                </label>

                <label>
                    Ice Level:
                    <select name="tea_ice">
                        <option value="Normal" selected>Normal ice</option>
                        <option value="Less">Less ice</option>
                        <option value="No">No ice</option>
                    </select>
                </label>
            </div>
            {% endif %}
        {% endfor %}
    </div>

        <!--  This is the Daily Special section -->
    <div class="card">
        <h3>Daily Special</h3>

        <label class="menu-item">
            <input type="checkbox" name="{{ daily_special }}">
            <strong>{{ daily_special }}</strong>
            (${{ daily_special_price }})
        </label>
    </div>

        <!-- This is the Special Instructions section -->
    <div class="card">
        <h3>Special Instructions</h3>
        <textarea name="special_instructions" rows="4"
                  placeholder="Less sugar, no onions, extra spicy..."></textarea>
    </div>

        <!-- This is the Customer Information section -->
    <div class="card">
        <h3>Customer Information</h3>

        <label>
            Name:
            <input type="text" name="customer_name">
        </label>

        <label>
            Phone:
            <input type="text" name="customer_phone">
        </label>

        <label>
            Email:
            <input type="email" name="customer_email">
        </label>
    </div>

        <button type="submit">Place Order</button>
    </form>
</section>



{% endblock %}
