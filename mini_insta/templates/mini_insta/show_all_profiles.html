{% extends "mini_insta/base.html" %}

{% block content %}
<h2>All Profiles</h2>

<div class="profiles-grid">
    {% for p in profiles %}
        <div class="profile-card">
            <a href="{% url 'profile_detail' pk=p.pk %}">
                <img src="{{ p.profile_image_url }}"
                     alt="Profile image for {{ p.username }}"
                     class="profile-img">
            </a>

            <h3>{{ p.display_name }}</h3>
            <p>@{{ p.username }}</p>
        </div>
    {% empty %}
        <p><em>No profiles found. Add some in the Django admin.</em></p>
    {% endfor %}
</div>
{% endblock %}
