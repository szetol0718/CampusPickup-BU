{% extends "mini_insta/base.html" %}

{% block content %}
<h2>Create Post for {{ profile.display_name }}</h2>

<form action="{% url 'create_post' profile.pk %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <p>
        <label for="id_caption">Caption:</label><br>
        {{ form.caption }}
    </p>

    <p>
        <label for="files">Select Photos</label><br>
        <input type="file" name="files" id="files" multiple>
    </p>

    <button type="submit">Submit</button>
    <a href="{% url 'profile_detail' profile.pk %}">Cancel</a>
</form>
{% endblock %}
