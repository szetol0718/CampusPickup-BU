File: base.html
Author: Louis Szeto (szetol@bu.edu), 2/12/2026
Description: Base template for mini_insta. Provides standard HTML layout,
CSS link, header/footer, and a content block for inheriting pages.
-->

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>mini_insta</title>

    <!-- Optional CSS (create later if you want) -->
    <link rel="stylesheet" href="{% static 'styles/a3.css' %}">
</head>

<body>
    <header>
        <h1>Mini Insta</h1>
        <hr>
        {% if profile %}
        <a href="{% url 'create_post' profile.pk %}">Create Post</a>
        {% endif %}
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <a href="{% url 'show_all_profiles' %}">Profiles</a>
    </footer>
</body>
</html>
