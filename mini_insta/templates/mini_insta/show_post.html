{% extends "mini_insta/base.html" %}

{% block content %}
<h2>Post</h2>
<div class="action-links">
    <a href="{% url 'update_post' post.pk %}">Update</a> |
    <a href="{% url 'delete_post' post.pk %}">Delete</a>
</div>
<p><strong>Caption:</strong> {{ post.caption }}</p>
<p><strong>Timestamp:</strong> {{ post.timestamp }}</p>

<h3>Photos</h3>

<div class="photos-grid">
    {% for photo in post.get_all_photos %}
        <div class="photo-card">
            <img src="{{ photo.get_image_url }}"
                 alt="Photo for post {{ post.pk }}"
                 class="post-img">
        </div>
    {% empty %}
        <p><em>No photos for this post.</em></p>
    {% endfor %}
</div>

<p>
    <a href="{% url 'profile_detail' post.profile.pk %}">Back to profile</a>
</p>
{% endblock %}
