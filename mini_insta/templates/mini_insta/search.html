{% extends "mini_insta/base.html" %}

{% block content %}
<h2>Search</h2>

<form method="get" action="{% url 'search' profile.pk %}">
    <p>
        <label for="query">Search for Profiles or Posts:</label><br>
        <input type="text" name="query" id="query" placeholder="Type keywords...">
    </p>

    <button type="submit">Search</button>
    <a href="{% url 'profile_detail' profile.pk %}">Cancel</a>
</form>
{% endblock %}
