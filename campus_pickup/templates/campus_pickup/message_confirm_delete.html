{% extends "campus_pickup/base.html" %}

{% block content %}
<section class="panel">
    <h2>Delete Ride Message #{{ object.id }}</h2>
    <p>Are you sure you want to delete this message?</p>
    <p><strong>Text:</strong> {{ object.text }}</p>

    <form method="post">
        {% csrf_token %}
        <button class="danger-link" type="submit">Yes, Delete</button>
        <a class="button-link" href="{% url 'campus_pickup:message_detail' object.pk %}">Cancel</a>
    </form>
</section>
{% endblock %}
