{% extends "campus_pickup/base.html" %}

{% block content %}
<section class="panel">
    <h2>Login to Campus Pickup</h2>
    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next|default:'/campus_pickup/' }}">
        <button type="submit">Login</button>
    </form>
    <p>
        Need an account?
        <a href="{% url 'campus_pickup:profile_create' %}">Create one here</a>.
    </p>
</section>
{% endblock %}
