{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Pickup</title>
    <link rel="stylesheet" href="{% static 'styles/campus_pickup.css' %}">
</head>
<body>
    <header>
        <h1>Campus Pickup</h1>
        <nav>
            <a href="{% url 'campus_pickup:home' %}">Home</a>
            <a href="{% url 'campus_pickup:profile_list' %}">Profiles</a>
            <a href="{% url 'campus_pickup:ride_list' %}">Rides</a>
            <a href="{% url 'campus_pickup:participant_list' %}">Ride Participants</a>
            <a href="{% url 'campus_pickup:message_list' %}">Ride Messages</a>
            {% if user.is_authenticated %}
            <span class="nav-status">Logged in as {{ user.username }}</span>
            <form method="post" action="{% url 'campus_pickup:logout' %}" class="nav-form">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
            {% else %}
            <a href="{% url 'campus_pickup:login' %}">Login</a>
            <a href="{% url 'campus_pickup:profile_create' %}">Create Account</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
