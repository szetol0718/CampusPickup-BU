{% extends "campus_pickup/base.html" %}

{% block content %}
<section class="panel">
    <h2>Add Message</h2>
    {% if ride %}
    <p>
        <strong>Ride:</strong>
        {{ ride.pickup_location }} to {{ ride.destination }}
    </p>
    {% endif %}

    <form method="post" class="form-grid">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <p>
            {{ form.text.label_tag }}
            {{ form.text }}
            {{ form.text.errors }}
        </p>
        <button type="submit">Save Message</button>
    </form>
</section>
{% endblock %}
