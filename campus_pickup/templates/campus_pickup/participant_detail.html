{% extends "campus_pickup/base.html" %}

{% block content %}
<section class="panel">
    <h2>Ride Participant #{{ participant.id }}</h2>
    <p>
        <strong>Ride:</strong>
        <a href="{% url 'campus_pickup:ride_detail' participant.ride.pk %}">
            Ride #{{ participant.ride.pk }}
        </a>
    </p>
    <p><strong>Passenger:</strong> {{ participant.passenger.display_name }}</p>
    <p><strong>Joined At:</strong> {{ participant.joined_at }}</p>
</section>
{% endblock %}
