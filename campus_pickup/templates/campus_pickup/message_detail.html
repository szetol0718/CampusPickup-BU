{% extends "campus_pickup/base.html" %}

{% block content %}
<section class="panel">
    <h2>Ride Message #{{ message.id }}</h2>
    <p>
        <a class="button-link" href="{% url 'campus_pickup:message_update' message.pk %}">Edit Message</a>
        <a class="button-link danger-link" href="{% url 'campus_pickup:message_delete' message.pk %}">Delete Message</a>
    </p>
    <p>
        <strong>Ride:</strong>
        <a href="{% url 'campus_pickup:ride_detail' message.ride.pk %}">
            Ride #{{ message.ride.pk }}
        </a>
    </p>
    <p><strong>Sender:</strong> {{ message.sender.display_name }}</p>
    <p><strong>Message Text:</strong> {{ message.text }}</p>
    <p><strong>Timestamp:</strong> {{ message.timestamp }}</p>
</section>
{% endblock %}
